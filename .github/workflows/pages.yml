name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: assets/post-images
          key: article-images-${{ hashFiles('content/posts/**') }}
          restore-keys: article-images-
      - name: Build Markdown articles
        run: python scripts/build.py
      - name: Collect static site
        run: |
          mkdir dist
          cp -R assets posts dist/
          cp .nojekyll 404.html articles.html index.html site.js styles.css sw.js videos.html dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
